openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is a documentation of App for saving contacts
tags:
  - name: Contacts
    description: Operations about users contacts.
  - name: Auth
    description: Auth operations.
servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-h3aa.onrender.com
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml

    post:
      $ref: ../swagger/paths/contacts/post.yaml

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{contactId}/get.yaml

    patch:
      $ref: ../swagger/paths/contacts/{contactId}/patch.yaml

    delete:
      $ref: ../swagger/paths/contacts/{contactId}/delete.yaml

  /auth/register:
    post:
      $ref: ../swagger/paths/auths/register.yaml

  /auth/login:
    post:
      $ref: ../swagger/paths/auths/login.yaml

  /auth/logout:
    post:
      $ref: ../swagger/paths/auths/logout.yaml

  /auth/refresh:
    post:
      $ref: ../swagger/paths/auths/refresh.yaml

  /auth/send-reset-email:
    post:
      $ref: ../swagger/paths/auths/send-reset-email.yaml

  /auth/reset-pwd:
    post:
      $ref: ../swagger/paths/auths/reset-pwd.yaml

  /auth/get-oauth-url:
    get:
      $ref: ../swagger/paths/auths/get-oauth-url.yaml

  /auth/confirm-oauth:
    post:
      $ref: ../swagger/paths/auths/confirm-oauth.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
